name: Weekly Benchmark Run

on:
  schedule:
    # Every Monday at 6am UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      systems:
        description: 'Comma-separated system names to run (empty = all)'
        required: false
        default: ''
      benchmark:
        description: 'Benchmark slug to run'
        required: false
        default: ''

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      neo4j:
        image: neo4j:5
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/benchdpass123

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install harness + dependencies
        run: |
          pip install -e ".[all]"
          pip install pyyaml chromadb crewai

      - name: Start Letta
        run: |
          docker run -d --name letta -p 8283:8283 letta/letta:latest
          sleep 30  # wait for startup

      - name: Write signing key
        run: |
          mkdir -p ./keys
          echo "${{ secrets.BENCHD_SIGNING_KEY }}" > ./keys/private.key
          chmod 600 ./keys/private.key

      - name: Run auto-benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: benchdpass123
        run: |
          SYSTEMS_ARG=""
          if [ -n "${{ github.event.inputs.systems }}" ]; then
            IFS=',' read -ra SYSTEMS <<< "${{ github.event.inputs.systems }}"
            for sys in "${SYSTEMS[@]}"; do
              SYSTEMS_ARG="$SYSTEMS_ARG --system $sys"
            done
          fi

          BENCH_ARG=""
          if [ -n "${{ github.event.inputs.benchmark }}" ]; then
            BENCH_ARG="--benchmark ${{ github.event.inputs.benchmark }}"
          fi

          benchd auto-run \
            --systems-dir ./systems \
            --out ./runs \
            --key ./keys/private.key \
            --time-series ./runs/time_series.json \
            $SYSTEMS_ARG $BENCH_ARG

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: |
            runs/*/manifest.signed.json
            runs/time_series.json
          retention-days: 90

      - name: Commit time series update
        run: |
          git config user.name "Bench'd Bot"
          git config user.email "bot@benchd.ai"
          git add -f runs/time_series.json
          git diff --cached --quiet || git commit -m "Weekly benchmark run $(date +%Y-%m-%d)

          Co-Authored-By: Bench'd Bot <bot@benchd.ai>"
          git push

      - name: Stop Letta
        if: always()
        run: docker rm -f letta || true
